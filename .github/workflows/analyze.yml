name: Analyze

on:
  pull_request:
    branches: [main, develop, feature/topup]
  push:
    branches: [main, develop, feature/topup]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
      - run: flutter pub get
      - run: flutter analyze